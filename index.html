<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIVE STAGE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}</style>
<title>LIVE STAGE 시제품</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Serif+Display&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: 상단 고정 헤더 + 화면별 본문. 라이브 화면은 데스크톱 3열(영상·출연자·채팅), 모바일은 세로 스택 + 하단 탭바 */
:root {
  --bg: #0b0b0d; --bg-2: #141418; --bg-3: #1d1d23; --line: #2a2a33;
  --fg: #f1efe8; --fg-2: #a9a7a0; --fg-3: #6e6c66;
  --gold: #d9b45a; --gold-2: #f0d48a; --gold-dim: rgba(217,180,90,.14);
  --violet: #8b6cf6; --violet-dim: rgba(139,108,246,.16);
  --live: #e5484d; --ok: #3ecf8e; --warn: #f5a524;
  --display: "DM Serif Display", "Noto Sans KR", serif;
  --body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #0b0b0d; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg-3); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--violet); outline-offset: 1px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
.tab-num, .num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--bg-3); border: 1px solid var(--line); padding: 2px 6px; border-radius: 5px; color: var(--gold-2); word-break: break-all; }

/* 헤더 */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(11,11,13,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.hdr-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin: 0 auto; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .06em; color: var(--gold); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgba(229,72,77,.25); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(229,72,77,0); } }
.nav { display: flex; gap: 2px; }
.nav button { padding: 7px 12px; border-radius: 8px; color: var(--fg-2); font-weight: 500; }
.nav button.on { color: var(--fg); background: var(--bg-3); }
.nav button:hover { color: var(--fg); }
.hdr .sp { flex: 1; }
.role { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }
.role select { width: auto; padding: 6px 28px 6px 10px; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-weight: 500; border: 1px solid var(--line); background: var(--bg-3); white-space: nowrap; }
.btn:hover { border-color: var(--fg-3); }
.btn.gold { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #1a1405; border-color: transparent; font-weight: 700; }
.btn.violet { background: var(--violet); border-color: transparent; color: #fff; }
.btn.danger { background: rgba(229,72,77,.14); border-color: rgba(229,72,77,.4); color: #ff8a8e; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* 시제품 배너 */
.demo-bar { background: var(--violet-dim); border-bottom: 1px solid rgba(139,108,246,.35); color: #c9bcff; font-size: 12px; text-align: center; padding: 6px 16px; }
.demo-bar b { color: #fff; }

/* 본문 */
.page { max-width: 1400px; margin: 0 auto; padding-block: 18px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin: 22px 0 12px; }
.sec-h h2 { font-size: 18px; font-weight: 700; }
.sec-h .cnt { color: var(--fg-3); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.pill.live { background: var(--live); color: #fff; }
.pill.new { background: var(--violet-dim); color: #c9bcff; }
.pill.hot { background: var(--gold-dim); color: var(--gold-2); }
.pill.gray { background: var(--bg-3); color: var(--fg-2); }
.pill.ok { background: rgba(62,207,142,.14); color: #6fe0ad; }
.pill.warn { background: rgba(245,165,36,.14); color: #ffc15c; }
.pill.bad { background: rgba(229,72,77,.14); color: #ff8a8e; }

/* 홈 */
.home-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1; min-width: 200px; position: relative; }
.search input { padding-left: 36px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--fg-3); }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 12px; scrollbar-width: none; }
.cats button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; font-size: 13px; }
.cats button.on { border-color: var(--gold); color: var(--gold-2); background: var(--gold-dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .15s, border-color .15s; }
.card:hover { transform: translateY(-2px); border-color: var(--fg-3); }
.thumb { aspect-ratio: 16/9; max-width: 100%; position: relative; display: grid; place-items: center; font-size: 44px; }
.thumb .tl { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; }
.thumb .br { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.6); border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
.card-b { padding: 10px 12px 12px; display: grid; gap: 3px; }
.card-b .t { font-weight: 700; font-size: 14px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-b .l { font-size: 12px; color: var(--fg-2); }
.card-b .l b { color: var(--gold); font-weight: 500; }
.empty { color: var(--fg-3); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* 라이브 */
.live-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px 320px; gap: 14px; align-items: start; }
.video { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.video canvas, .video video { display: block; width: 100%; aspect-ratio: 16/9; max-width: 100%; background: #000; }
.video .ov { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
.video .ov-top { display: flex; gap: 8px; align-items: center; }
.video .sample { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; color: rgba(255,255,255,.75); pointer-events: none; }
.video .sample b { display: block; font-size: 15px; color: #fff; }
.video .sample small { font-size: 11px; }
.alert-stack { position: absolute; left: 12px; bottom: 12px; display: grid; gap: 6px; max-width: 80%; }
.gift-alert { background: linear-gradient(90deg, rgba(217,180,90,.95), rgba(139,108,246,.9)); color: #130f05; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 13px; animation: slidein .35s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.gift-alert.big { font-size: 15px; padding: 11px 14px; background: linear-gradient(90deg, #f0d48a, #d9b45a); }
@keyframes slidein { from { transform: translateX(-20px); opacity: 0; } }
.live-meta { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-top: 12px; flex-wrap: wrap; }
.live-meta h1 { font-size: 18px; font-weight: 700; }
.live-meta .host { color: var(--fg-2); font-size: 13px; margin-top: 2px; }
.live-meta .host b { color: var(--gold); font-weight: 500; }
.live-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.panel-h small { color: var(--fg-3); font-weight: 400; }
.rank-list { display: grid; gap: 6px; padding: 10px; }
.perf { display: grid; grid-template-columns: 26px 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--bg-3); border: 1px solid transparent; transition: background .3s; }
.perf.r1 { border-color: var(--gold); background: var(--gold-dim); }
.perf.flash { background: rgba(217,180,90,.35); }
.perf .rk { font-family: var(--display); font-size: 18px; color: var(--fg-3); text-align: center; }
.perf.r1 .rk { color: var(--gold-2); }
.perf.r2 .rk { color: #cfcfd6; }
.perf.r3 .rk { color: #c7905a; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--bg); border: 1px solid var(--line); }
.perf .nm { font-weight: 700; font-size: 13px; }
.perf .amt { font-size: 12px; color: var(--fg-2); }
.perf .amt b { color: var(--gold-2); font-weight: 700; }
.perf .gbtn { padding: 6px 10px; border-radius: 8px; background: var(--gold); color: #1a1405; font-weight: 700; font-size: 12px; }
.perf .gbtn:hover { background: var(--gold-2); }
.bar { height: 3px; background: var(--bg); border-radius: 2px; grid-column: 1 / -1; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--gold)); transition: width .4s; }
.chat { display: flex; flex-direction: column; height: 560px; }
.chat-log { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-height: 0; }
.msg { line-height: 1.4; animation: fadein .25s; word-break: break-word; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
.msg .u { font-weight: 700; color: var(--fg-2); margin-right: 5px; }
.msg.mod .u { color: var(--ok); }
.msg.me .u { color: var(--violet); }
.msg.gift { background: var(--gold-dim); border-left: 2px solid var(--gold); padding: 5px 8px; border-radius: 6px; }
.msg.gift .u { color: var(--gold-2); }
.msg.sys { color: var(--fg-3); font-size: 12px; font-style: italic; }
.chat-in { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
.chat-in input { flex: 1; min-width: 0; }
.chat-hint { font-size: 11px; color: var(--fg-3); padding: 0 12px 10px; }

/* 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; }
.modal-b { padding: 16px; display: grid; gap: 12px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.x { font-size: 20px; color: var(--fg-3); line-height: 1; padding: 4px 8px; }
.note { background: var(--violet-dim); border: 1px solid rgba(139,108,246,.35); color: #d9d0ff; font-size: 12px; padding: 8px 10px; border-radius: 8px; }
.note.gold { background: var(--gold-dim); border-color: rgba(217,180,90,.4); color: var(--gold-2); }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pick button { border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; display: grid; gap: 2px; justify-items: center; background: var(--bg-3); font-size: 12px; }
.pick button .e { font-size: 24px; }
.pick button .v { color: var(--gold-2); font-weight: 700; }
.pick button.on { border-color: var(--gold); background: var(--gold-dim); }
.lbl { font-size: 12px; color: var(--fg-2); display: grid; gap: 5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sum { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 8px; background: var(--bg-3); font-weight: 700; }
.sum b { color: var(--gold-2); }

/* 토스트 */
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bg-3); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: fadein .2s; max-width: calc(100% - 32px); }

/* 스튜디오·관리자 */
.dash { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 16px; align-items: start; }
.side { display: grid; gap: 4px; position: sticky; top: 70px; }
.side button { text-align: left; padding: 9px 12px; border-radius: 8px; color: var(--fg-2); font-weight: 500; }
.side button.on { background: var(--bg-3); color: var(--fg); border-left: 2px solid var(--gold); }
.side .sel { margin-bottom: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat .k { font-size: 11px; color: var(--fg-3); letter-spacing: .06em; text-transform: uppercase; }
.stat .v { font-size: 22px; font-weight: 900; margin-top: 2px; }
.stat .v.gold { color: var(--gold-2); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); font-weight: 700; background: var(--bg-3); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.form { display: grid; gap: 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; }
.chip button { color: var(--fg-3); font-size: 14px; line-height: 1; padding: 0 4px; }
.chip button:hover { color: var(--live); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; }
.swatches button.on { border-color: #fff; }
.emos button { width: 36px; height: 36px; border-radius: 8px; font-size: 20px; background: var(--bg-3); border: 2px solid transparent; }
.emos button.on { border-color: var(--gold); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.safety { display: grid; gap: 8px; }
.safety label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.safety input[type=checkbox] { width: auto; margin-top: 3px; }

/* 하단 탭바 (모바일) */
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: rgba(11,11,13,.95); border-top: 1px solid var(--line); z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.tabbar button { flex: 1; padding: 8px 4px 10px; font-size: 11px; color: var(--fg-3); display: grid; justify-items: center; gap: 2px; }
.tabbar button span { font-size: 18px; }
.tabbar button.on { color: var(--gold-2); }

@media (max-width: 1100px) { .live-layout { grid-template-columns: minmax(0,1fr) 300px; } .live-layout .chat { grid-column: 1 / -1; height: 420px; } }
@media (max-width: 760px) {
  .hdr .nav, .hdr .role, .hdr .auth { display: none; }
  .live-layout { grid-template-columns: 1fr; } .live-layout .chat { grid-column: auto; height: 380px; }
  .dash { grid-template-columns: 1fr; } .side { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .side button { white-space: nowrap; } .side button.on { border-left: 0; border-bottom: 2px solid var(--gold); }
  .side .sel { min-width: 180px; margin: 0; }
  .form .two, .split { grid-template-columns: 1fr; }
  .tabbar { display: flex; }
  .page { padding-bottom: 100px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <button class="brand" data-go="home"><i></i><span id="brandName">LIVE STAGE</span></button>
    <nav class="nav" id="nav">
      <button data-go="home">홈</button>
      <button data-go="live">라이브</button>
      <button data-go="studio">스튜디오</button>
      <button data-go="admin">관리자</button>
    </nav>
    <div class="sp"></div>
    <div class="role">데모 역할
      <select id="roleSel"><option value="viewer">시청자</option><option value="host">호스트/레이블</option><option value="admin">관리자</option></select>
    </div>
    <div class="auth row" id="authBox">
      <button class="btn sm ghost" data-act="login">로그인</button>
      <button class="btn sm gold" data-act="signup">회원가입</button>
    </div>
  </div>
</div>
<div class="demo-bar" id="demoBar">🔒 <b>베타</b> — 실제 결제 없음. 모든 금액과 선물은 가상 포인트입니다.</div>

<main class="page" id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-go="home"><span>⌂</span>홈</button>
  <button data-go="live"><span>▶</span>라이브</button>
  <button data-go="studio"><span>◎</span>스튜디오</button>
  <button data-go="admin"><span>⚙</span>관리자</button>
</nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================
   설정 — 플랫폼 이름 등은 여기서만 바꾸면 전체에 반영됩니다.
   API 키·비밀번호·결제 정보는 이 파일에 넣지 않습니다.
   실제 서비스에서는 서버의 환경변수(.env)로 관리합니다.
   ========================================================= */
const CONFIG = {
  name: 'LIVE STAGE',
  supabaseUrl: 'https://zomssaylcebzirpvprgq.supabase.co',
  supabaseKey: 'sb_publishable_DNuVzh6ufm5w3vDidiJCdw_Aeux-DQ8',   // publishable(공개) 키. secret 키는 절대 여기 넣지 않음
  serverStreamId: 's1',                                              // 서버(DB) 연동되는 방송 id
  currency: '스타',          // 가상 선물 단위
  krwPerStar: 100,           // 1스타 = 100원 (가상 환산, 예시)

    sb.from('performers').select('*').eq('stream_id', s.id).order('sort'),
  ]);
  if (st) { s.title = st.title; s.hostName = st.host_nick; s.status = st.status; if (st.play_url) s.playUrl = st.play_url; }
  if (pf && pf.length) s.performers = pf.map(p => ({ id: p.id, name: p.name, emoji: p.emoji, total: Number(p.total) }));
  save();
}

let hlsInst = null;
function playStream(url) {
  const v = $('#vidEl'), msg = $('#vidMsg'); if (!v) return;
  const say = t => { if (msg) msg.innerHTML = `<small>${esc(t)}</small>`; };
  if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
  const um = $('#unmute'); if (um) um.onclick = () => { v.muted = false; v.play().catch(()=>{}); um.remove(); };
  let rot = 0; try { rot = +(localStorage.getItem('ls-rot')||0); } catch(e) {}
  const applyRot = () => { v.style.transform = rot ? `rotate(${rot}deg)` : ''; v.style.objectFit = 'contain'; };
  applyRot();
  const rb = $('#rotate'); if (rb) rb.onclick = () => { rot = (rot + 180) % 360; try { localStorage.setItem('ls-rot', rot); } catch(e) {} applyRot(); };
  if (window.Hls && Hls.isSupported()) {
    hlsInst = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 6, backBufferLength: 10 });
    hlsInst.loadSource(url); hlsInst.attachMedia(v);
    hlsInst.on(Hls.Events.MANIFEST_PARSED, () => { say(''); v.play().catch(()=>{}); });
    hlsInst.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) say(location.protocol==='https:' && url.startsWith('http:') ? '보안 페이지(https)에서는 http 주소를 재생할 수 없습니다. 다운로드한 파일로 열어주세요.' : '영상을 불러올 수 없습니다. 송출이 켜져 있는지, 주소·방화벽(8888)을 확인하세요.'); });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; v.addEventListener('loadedmetadata', () => { say(''); v.play().catch(()=>{}); }); v.addEventListener('error', () => say('영상을 불러올 수 없습니다. 송출 상태와 주소를 확인하세요.')); }
  else say('이 브라우저는 HLS 재생을 지원하지 않습니다.');
}
function drawVideo(s) {
  const c = $('#vid'); if (!c) return; const ctx = c.getContext('2d'); let t = 0;
  const hue = s.hue;
  const frame = () => {
    t += 0.01;
    const g = ctx.createLinearGradient(0,0,960,540); g.addColorStop(0,`hsl(${hue} 40% 10%)`); g.addColorStop(1,`hsl(${(hue+60)%360} 50% 6%)`);
    ctx.fillStyle = g; ctx.fillRect(0,0,960,540);
    for (let i=0;i<5;i++){ const x = 480 + Math.sin(t*1.3+i*1.7)*300, y = 270 + Math.cos(t*0.9+i*2.1)*150; const r = 120 + Math.sin(t+i)*30;
      const rg = ctx.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,`hsla(${(hue+i*35)%360} 70% 55% / .22)`); rg.addColorStop(1,'transparent'); ctx.fillStyle = rg; ctx.fillRect(x-r,y-r,r*2,r*2); }
    // 출연자 자리 표시
    const n = s.performers.length; s.performers.forEach((p,i)=>{ const w = 960/n; const x = w*i; ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.strokeRect(x+8,8,w-16,524); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.fillText(p.emoji+' '+p.name, x+w/2, 500); });
    if (s.status==='live' && document.body.contains(c)) rafId = requestAnimationFrame(frame);
  };
  frame();
}

        <div class="lbl">썸네일 색상<div class="swatches">${THUMB_HUES.map(h=>`<button data-hue="${h}" style="background:hsl(${h} 45% 35%)" class="${h===270?'on':''}" aria-label="색상"></button>`).join('')}</div></div>
        <div class="lbl">썸네일 아이콘<div class="emos row">${EMOJIS.map(e=>`<button data-emo="${e}" class="${e==='🎤'?'on':''}">${e}</button>`).join('')}</div></div>
        <div class="lbl">스트림 키 (샘플)<input value="•••• 실제 키는 서버에서 발급, 화면에 평문 노출 금지" disabled></div>
        <div class="safety"><label><input type="checkbox" id="cAgree"> 커뮤니티 가이드라인(불법 콘텐츠·강요·괴롭힘 금지, 운영자 중단 권한)에 동의합니다</label></div>

        <div class="lbl">썸네일 색상<div class="swatches">${THUMB_HUES.map(h=>`<button data-hue="${h}" style="background:hsl(${h} 45% 35%)" class="${h===s.hue?'on':''}" aria-label="색상"></button>`).join('')}</div></div>
        <div class="lbl">썸네일 아이콘<div class="emos row">${EMOJIS.map(e=>`<button data-emo="${e}" class="${e===s.emoji?'on':''}">${e}</button>`).join('')}</div></div>
        <div class="lbl">미리보기<div class="thumb" style="${grad(s.hue)};border-radius:10px;max-width:280px;font-size:40px" id="ePrev">${s.emoji}</div></div>
        <div class="row"><button class="btn gold" id="eSave">저장</button>${s.status==='live'?`<button class="btn danger" id="endStream">⏹ 방송 종료</button>`:''}</div>

    performers: () => `
      <div class="form">

        <div class="tbl-wrap"><table><tr><th>출연자</th><th class="r">누적 ${CONFIG.currency}</th><th class="r">건수</th><th></th></tr>
        ${s.performers.map(p=>`<tr><td>${p.emoji} ${esc(p.name)}</td><td class="r num">${p.total.toLocaleString()}</td><td class="r num">${s.donations.filter(d=>d.performerId===p.id).length}</td><td class="r"><button class="btn sm danger" data-del="${p.id}">삭제</button></td></tr>`).join('')}</table></div>
        <div class="note">삭제해도 과거 후원 내역은 정산을 위해 보존됩니다.</div>
      </div>`,
    donations: () => `
      <div class="row" style="margin-bottom:10px"><span class="pill gray num">총 ${s.donations.length}건</span><span class="pill hot num">${STAR(totalStars)}</span></div>
      <div class="tbl-wrap"><table><tr><th>시각</th><th>보낸 사람</th><th>받은 출연자</th><th>선물</th><th class="r">${CONFIG.currency}</th><th class="r">원화 환산</th></tr>
      ${[...s.donations].reverse().slice(0,60).map(d=>`<tr><td class="num">${fmtDate(d.at)}</td><td>${esc(d.from)}</td><td>${esc(d.performerName)}</td><td>${d.emoji} ${esc(d.gift)}</td><td class="r num">${d.stars.toLocaleString()}</td><td class="r num">${KRW(d.stars*CONFIG.krwPerStar)}</td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--fg-3)">후원 내역이 없습니다</td></tr>'}</table></div>
      ${s.donations.length>60?'<p style="color:var(--fg-3);font-size:12px">최근 60건만 표시</p>':''}`,
    mods: () => `
      <div class="form">
        <div class="note">모더레이터는 채팅 삭제·이용자 타임아웃·채팅 느리게 모드 등을 맡습니다. (시제품: 지정만 가능)</div>
        <div class="row"><input id="mName" placeholder="모더레이터 닉네임" style="flex:1;min-width:140px"><button class="btn gold" id="mAdd">지정</button></div>
        <div class="chips">${s.moderators.map(m=>`<span class="chip">🛡 ${esc(m)}<button data-unmod="${esc(m)}">×</button></span>`).join('') || '<span style="color:var(--fg-3)">지정된 모더레이터 없음</span>'}</div>
        <div class="lbl">모더레이터 권한 (예시)<div class="safety">
          <label><input type="checkbox" checked disabled> 채팅 메시지 삭제</label>
          <label><input type="checkbox" checked disabled> 이용자 타임아웃(10분)</label>
          <label><input type="checkbox" disabled> 방송 종료 (호스트 전용)</label></div></div>
      </div>`,
  }[S.studioTab]();
  app.innerHTML = `<div class="dash">
    <aside class="side">
      <select class="sel" id="stSel">${mine.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.status==='live'?'🔴':'⚪'} ${esc(x.title.slice(0,22))}</option>`).join('')}</select>
      ${tabs.map(([k,v])=>`<button data-tab="${k}" class="${k===S.studioTab?'on':''}">${v}</button>`).join('')}
    </aside>
    <section style="min-width:0"><div class="sec-h" style="margin-top:0"><span class="eyebrow">Studio</span><h2>${tabs.find(t=>t[0]===S.studioTab)[1]}</h2><span class="cnt">${esc(labelOf(s.labelId).name)} · ${esc(s.title)}</span></div>${body}</section></div>`;
  $('#stSel').onchange = e => { S.studioStreamId = e.target.value; save(); renderStudio(); };
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.studioTab=b.dataset.tab; save(); renderStudio(); });
  const endBtn = $('#endStream'); if (endBtn) endBtn.onclick = () => confirmBox('방송을 종료할까요?', '종료 후 후원 내역은 정산 화면에 그대로 남습니다.', () => { s.status='ended'; s.viewers=0; save(); renderStudio(); toast('방송을 종료했습니다'); });
  const rs = $('#restart'); if (rs) rs.onclick = () => { s.status='live'; s.viewers=10; s.startedAt=Date.now(); save(); renderStudio(); };
  // 생성
  let hue = s.hue, emo = s.emoji; if (S.studioTab==='create') { hue = 270; emo = '🎤'; }
  app.querySelectorAll('[data-hue]').forEach(b=>b.onclick=()=>{ hue=+b.dataset.hue; app.querySelectorAll('[data-hue]').forEach(x=>x.classList.toggle('on',x===b)); const p=$('#ePrev'); if(p) p.style.cssText = grad(hue)+'border-radius:10px;max-width:280px;font-size:40px'; });
  app.querySelectorAll('[data-emo]').forEach(b=>b.onclick=()=>{ emo=b.dataset.emo; app.querySelectorAll('[data-emo]').forEach(x=>x.classList.toggle('on',x===b)); const p=$('#ePrev'); if(p) p.textContent = emo; });
  const mk = $('#cMake'); if (mk) mk.onclick = () => {
    const title = $('#cTitle').value.trim(), host = $('#cHost').value.trim();
    if (!title || !host) { toast('제목과 호스트 이름을 입력하세요'); return; }
    if (!$('#cAgree').checked) { toast('가이드라인 동의가 필요합니다'); return; }
    const perfs = $('#cPerf').value.split(',').map(x=>x.trim()).filter(Boolean); if (!perfs.includes(host)) perfs.unshift(host);
    const ns = { id: uid(), title, labelId: $('#cLabel').value, hostName: host, category: $('#cCat').value, hue, emoji: emo, viewers: 1, status:'live', startedAt: Date.now(), isNew: true,
      performers: perfs.map((n,i)=>({ id: uid(), name: n, emoji: EMOJIS[i%EMOJIS.length], total: 0 })), moderators: [], donations: [] };
    S.streams.unshift(ns); S.studioStreamId = ns.id; S.currentStreamId = ns.id; S.studioTab = 'overview'; save(); renderStudio(); toast('방송이 생성되었습니다 (홈에 신규로 표시)');
  };
  const es = $('#eSave'); if (es) es.onclick = () => { s.title = $('#eTitle').value.trim() || s.title; s.category = $('#eCat').value; s.hostName = $('#eHost').value.trim() || s.hostName; s.playUrl = $('#ePlay').value.trim(); s.hue = hue; s.emoji = emo; save(); renderStudio(); toast('저장했습니다'); };
  const sv = $('#svSave'); if (sv) sv.onclick = () => { const tunnel = $('#svTunnel').value.trim().replace(/\/$/,''); const ip = $('#svIp').value.trim(); const path = ($('#svPath').value.trim() || 'live/stream').replace(/^\/|\/$/g,''); if (!tunnel.startsWith('https://')) { toast('터널 주소(https://…)를 입력하세요'); return; } S.server = { ip, path, tunnel }; s.playUrl = `${tunnel}/${path}/index.m3u8`; save(); renderStudio(); toast('이 방송이 실제 송출에 연결되었습니다 → 라이브 탭에서 확인'); };
  const pa = $('#pAdd'); if (pa) pa.onclick = () => { const n = $('#pName').value.trim(); if (!n) return; s.performers.push({ id: uid(), name: n, emoji: $('#pEmo').value, total: 0 }); save(); renderStudio(); };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ s.performers = s.performers.filter(p=>p.id!==b.dataset.del); save(); renderStudio(); });
  const ma = $('#mAdd'); if (ma) ma.onclick = () => { const n = $('#mName').value.trim(); if (n && !s.moderators.includes(n)) s.moderators.push(n); save(); renderStudio(); };
  app.querySelectorAll('[data-unmod]').forEach(b=>b.onclick=()=>{ s.moderators = s.moderators.filter(m=>m!==b.dataset.unmod); save(); renderStudio(); });
}
function confirmBox(title, text, onOk, okLabel='확인') {
  modal(title, `<p style="margin:0;color:var(--fg-2)">${text}</p>`, `<button class="btn ghost" data-close>취소</button><button class="btn danger" id="cbOk">${okLabel}</button>`);
  $('#cbOk').onclick = () => { closeModal(); onOk(); };
}

      <div class="sec-h"><h2>레이블별 정산 (가상)</h2></div>
      <div class="tbl-wrap"><table><tr><th>레이블</th><th class="r">총 결제</th><th class="r">레이블 몫</th><th class="r">출연자 몫</th><th>상태</th></tr>
      ${byLabel.map(({l,st})=>`<tr><td>${esc(l.name)}</td><td class="r num">${KRW(st)}</td><td class="r num">${KRW(st*sp.label/100)}</td><td class="r num">${KRW(st*sp.performer/100)}</td><td><span class="pill gray">정산 예정 (시제품)</span></td></tr>`).join('')}</table></div>
      <div class="sec-h"><h2>최근 가상 결제 내역</h2></div>
      <div class="tbl-wrap"><table><tr><th>시각</th><th>방송</th><th>보낸 사람</th><th>출연자</th><th>선물</th><th class="r">금액</th><th>상태</th></tr>
      ${allDon.sort((a,b)=>b.at-a.at).slice(0,40).map(d=>{ const s=S.streams.find(x=>x.id===d.streamId); return `<tr><td class="num">${fmtDate(d.at)}</td><td>${s?esc(s.title.slice(0,16))+'…':'-'}</td><td>${esc(d.from)}</td><td>${esc(d.performerName)}</td><td>${d.emoji} ${esc(d.gift)}</td><td class="r num">${KRW(d.stars*CONFIG.krwPerStar)}</td><td><span class="pill ${s&&s.status==='stopped'?'warn':'ok'}">${s&&s.status==='stopped'?'정산 보류':'가상 승인'}</span></td></tr>`; }).join('')}</table></div>`;
    },
  }[S.adminTab]();
  app.innerHTML = `<div class="dash">
    <aside class="side">${tabs.map(([k,v])=>`<button data-tab="${k}" class="${k===S.adminTab?'on':''}">${v}</button>`).join('')}<button class="btn sm ghost" id="resetBtn" style="margin-top:12px;color:var(--fg-3)">샘플 데이터 초기화</button></aside>
    <section style="min-width:0"><div class="sec-h" style="margin-top:0"><span class="eyebrow">Admin</span><h2>${tabs.find(t=>t[0]===S.adminTab)[1]}</h2></div>${body}</section></div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.adminTab=b.dataset.tab; save(); renderAdmin(); });
  $('#resetBtn').onclick = () => confirmBox('샘플 데이터 초기화', '내가 보낸 가상 선물, 만든 방송, 신고 내역이 모두 지워집니다.', resetAll, '초기화');
  app.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>{ const l = S.labels.find(x=>x.id===b.dataset.id); l.status = b.dataset.lb==='approve'?'active':'suspended'; save(); renderAdmin(); });
  app.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{ const s = S.streams.find(x=>x.id===b.dataset.stop);
    confirmBox('🛑 방송 강제 중단', `"${esc(s.title)}" 을(를) 즉시 중단합니다. 시청자에게 중단 안내가 표시되고, 이 방송의 후원은 정산 보류로 전환됩니다.`, () => { s.status='stopped'; s.viewers=0; save(); renderAdmin(); toast('방송을 중단했습니다 · 후원 정산 보류'); }, '중단'); });
  app.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{ const r = S.reports.find(x=>x.id===b.dataset.id);
    if (b.dataset.rp==='suspend') { let u = S.users.find(x=>x.name===r.target); if (!u) { u = { id: uid(), name: r.target, role:'viewer', status:'active' }; S.users.push(u); } u.status='suspended'; u.until = Date.now()+86400000*3; r.status='resolved'; toast(`${r.target} 3일 정지`); }
    else r.status = b.dataset.rp==='resolve'?'resolved':'dismissed';
    save(); renderAdmin(); });
  $('#uDo') && ($('#uDo').onclick = () => { const n = $('#uName').value.trim(); if (!n) return; let u = S.users.find(x=>x.name===n); if (!u) { u = { id: uid(), name: n, role:'viewer', status:'active' }; S.users.push(u); } u.status = $('#uAct').value; u.until = u.status==='suspended'?Date.now()+86400000*3:null; save(); renderAdmin(); });
  app.querySelectorAll('[data-ban]').forEach(b=>b.onclick=()=>{ const u=S.users.find(x=>x.id===b.dataset.ban); u.status='suspended'; u.until=Date.now()+86400000*3; save(); renderAdmin(); });
  app.querySelectorAll('[data-unban]').forEach(b=>b.onclick=()=>{ const u=S.users.find(x=>x.id===b.dataset.unban); u.status='active'; u.until=null; save(); renderAdmin(); });
}

/* ---------- 전역 이벤트 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-act],[data-close],[data-gift-to]');
  if (!t) return;
  if (t.hasAttribute('data-close') && e.target === t) { closeModal(); return; }
  if (t.dataset.open) { go('live', { streamId: t.dataset.open }); return; }
  if (t.dataset.go) { go(t.dataset.go, { streamId: t.dataset.view }); return; }
  if (t.dataset.giftTo) { openGift(cur(), t.dataset.giftTo); return; }
  const s = cur();
  switch (t.dataset.act) {
    case 'gift': openGift(s); break;
    case 'report': openReport(s); break;
    case 'block': openBlock(); break;
    case 'share': navigator.clipboard?.writeText(location.href).then(()=>toast('링크를 복사했습니다')).catch(()=>toast('이 환경에서는 복사가 막혀 있습니다')); break;
    case 'logout': logout(); break;
    case 'login': case 'signup':
      if (sb) { openAuth(t.dataset.act); break; }
      modal(t.dataset.act==='login'?'로그인 (시제품)':'회원가입 (시제품)', `<div class="note">실제 인증 서버가 없어 입력값은 저장되지 않습니다. 실제 서비스에서는 이메일/휴대폰 인증 + 소셜 로그인으로 연결합니다.</div>
        <div class="lbl">닉네임 (화면 표시용)<input id="nick" value="${esc(S.myName)}"></div>
        <div class="lbl">이메일<input type="email" placeholder="you@example.com"></div>
        <div class="lbl">비밀번호<input type="password" placeholder="••••••••" autocomplete="off"></div>`,
        `<button class="btn ghost" data-close>닫기</button><button class="btn gold" id="nickSave">데모 닉네임 적용</button>`);
      $('#nickSave').onclick = () => { S.myName = $('#nick').value.trim() || S.myName; save(); closeModal(); toast(`${S.myName} 으로 표시됩니다`); };
      break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#roleSel').addEventListener('change', e => { S.role = e.target.value; save(); go({viewer:'home',host:'studio',admin:'admin'}[S.role]); });
render();
loadMe().then(() => { if (route()==='live') render(); });
if (sb) sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { ME = null; renderAuthBox(); } });
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
