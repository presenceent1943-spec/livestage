# main 브랜치에 올리면 GitHub Pages로 자동 배포
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # v2 미리보기: v2-demo 브랜치를 /v2/ 하위 경로로 함께 배포 (기존 사이트는 그대로)
      - uses: actions/checkout@v4
        with:
          ref: v2-demo
          path: v2
      - run: rm -rf v2/.git v2/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
