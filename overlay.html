<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE STAGE 오버레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Noto Sans KR", -apple-system, system-ui, sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; }
  #err { position: absolute; left: 16px; top: 16px; right: 16px; max-width: 640px; color: #fff; background: rgba(229,72,77,.92); border: 2px solid #fff; padding: 12px 16px; border-radius: 10px; font: 700 16px/1.5 "Noto Sans KR", sans-serif; display: none; white-space: pre-wrap; word-break: keep-all; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
  #err small { display: block; font-weight: 400; font-size: 13px; opacity: .9; margin-top: 6px; }
  #ctl { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px 10px; background: rgba(10,10,14,.9); border: 1px solid rgba(212,175,90,.5); border-radius: 12px; z-index: 50; max-width: calc(100% - 32px); }
  #ctl.on { display: flex; }
  #ctl button { font: 700 13px "Noto Sans KR", sans-serif; color: #f2efe9; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #ctl button:hover { background: rgba(212,175,90,.3); border-color: #d4af5a; }
  #ctl button.on { background: rgba(139,108,246,.45); border-color: #8b6cf6; }
  #ctl .sep { width: 1px; background: rgba(255,255,255,.18); margin: 0 4px; }
  #ctl .info { font: 12px "Noto Sans KR", sans-serif; color: rgba(242,239,233,.7); width: 100%; text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="err" role="alert"></div>
<div id="ctl" aria-label="효과 테스트">
  <button data-t="small">소형 선물</button><button data-t="mid">중형 선물</button><button data-t="big">대형 선물</button><button data-t="huge">초대형 선물</button>
  <span class="sep"></span>
  <button data-t="round">라운드 배너</button><button data-t="mission">미션 배너</button>
  <span class="sep"></span>
  <button id="btnPause">일시정지</button><button id="btnSkip">건너뛰기</button>
  <span class="info" id="ctlInfo"></span>
</div>
<script type="module">
  // OBS 브라우저 소스용 투명 오버레이.
  //   overlay.html?stream=방송ID&scale=1.5&pos=tr&theme=dark|light|minimal&spacing=normal|compact&fx=low&missions=0&timer=0&mode=demo|server&test=1
  //   mode 생략 시: 방송ID 가 'd' 로 시작하면 demo(브라우저 안 시연 데이터), 아니면 server
  const q = new URLSearchParams(location.search);
  const err = document.getElementById('err');
  const showErr = (msg, sub) => { err.style.display = 'block'; err.innerHTML = msg + (sub ? `<small>${sub}</small>` : ''); };
  const streamId = (q.get('stream') || '').trim();
  if (q.get('bg') === '1') document.body.style.background = 'radial-gradient(ellipse at 50% 110%, #3a2a55 0%, #15121c 55%, #0b0b0d 100%)';   // 미리보기용 배경 (OBS 에서는 사용 안 함)
  if (q.get('bg') === '1') document.body.style.background = 'radial-gradient(ellipse at 50% 110%, #3a2a55 0%, #15121c 55%, #0b0b0d 100%)';   // 미리보기용 배경 (OBS 에서는 사용 안 함)
  const param = (k, d) => q.has(k) ? q.get(k) : d;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  if (!streamId) {
    showErr('주소에 ?stream=방송ID 가 필요합니다', '예: overlay.html?stream=d1&scale=1.5&pos=tr');
  } else {
    const mode = ['demo', 'server'].includes(q.get('mode')) ? q.get('mode') : (streamId.startsWith('d') ? 'demo' : 'server');
    try { localStorage.setItem('livestage-v2-mode', JSON.stringify(mode)); } catch (e) {}
    let data, mount;
    try {
      ({ data } = await import('./app/data.js'));
      ({ mount } = await import('./app/excel-board.js'));
      await data.init();
    } catch (e) {
      console.error(e);
      showErr('오버레이를 불러오지 못했습니다', esc(e && e.message || e));
      data = null;
    }
    if (data) {
      let stream = null;
      try { stream = await data.stream(streamId); } catch (e) { console.error(e); showErr('방송 정보를 읽지 못했습니다', esc(e.message || e)); }
      if (!stream && !err.style.display.includes('block')) {
        const fell = mode === 'server' && data.mode !== 'server' ? `서버 모드 연결 실패로 시연 모드로 전환됨 (${esc(data.serverError || '')})` : `현재 모드: ${data.mode}`;
        showErr(`방송을 찾을 수 없습니다: ${esc(streamId)}`, fell);
      } else if (stream) {
        const b = mount(document.getElementById('stage'), {
          data, streamId, mode: 'obs',
          scale: parseFloat(param('scale', '1')) || 1,
          pos: param('pos', 'tl'),
          theme: param('theme', 'dark'),
          spacing: param('spacing', 'normal'),
          fx: param('fx', 'full'),
          showMissions: param('missions', '1') !== '0',
          showTimer: param('timer', '1') !== '0',
          showTeams: param('teams', 'auto') === '0' ? false : param('teams', 'auto') === '1' ? true : 'auto',
        });
        window.__xb = b;
        if (data.mode !== mode) console.warn(`[overlay] 요청한 모드(${mode}) 대신 ${data.mode} 모드로 동작 중`, data.serverError || '');
        if (q.get('test') === '1') {
          const ctl = document.getElementById('ctl'); ctl.classList.add('on');
          const info = document.getElementById('ctlInfo');
          info.textContent = `stream=${streamId} · mode=${data.mode} · ${esc(stream.title || '')}`;
          ctl.querySelectorAll('button[data-t]').forEach(x => x.onclick = () => b.test(x.dataset.t));
          const bp = document.getElementById('btnPause'); let paused = false;
          bp.onclick = () => { paused = !paused; b.pause(paused); bp.classList.toggle('on', paused); bp.textContent = paused ? '재개' : '일시정지'; };
          document.getElementById('btnSkip').onclick = () => b.skip();
        }
      }
    }
  }
</script>
</body>
</html>
