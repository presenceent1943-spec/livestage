# LIVE STAGE - MediaMTX (PC server). start.ps1 reads password.txt, fills __PASS__ and writes mediamtx.yml
# publish needs the password; read (viewing) is open to everyone.
logLevel: info
authMethod: internal
authInternalUsers:
  - user: presence
    pass: __PASS__
    permissions:
      - action: publish
        path: ""
  - user: any
    pass:
    permissions:
      - action: read
        path: ""
      - action: playback
        path: ""
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
rtsp: no
srt: no
paths:
  all_others:
    source: publisher
